    <meta property="og:image" content="https://pocketmusic.qzz.io/icon.png">

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: system-ui;
        }

        .header {
            position: sticky;
            top: 0;
            background: #000;
            padding: 15px;
            z-index: 100;
        }

        .header input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: #181818;
            color: white;
            box-sizing: border-box;
        }

        .row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 10px;
        }

        .card {
            min-width: 160px;
            background: #181818;
            border-radius: 15px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .full {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(#222, #000);
            z-index: 9999;
        }

        .full img {
            width: 280px;
            height: 280px;
            border-radius: 20px;
            object-fit: cover;
        }

        .mini {
            position: fixed;
            left: 10px;
            right: 10px;
            bottom: 10px;
            display: none;
            background: #181818;
            border-radius: 15px;
            padding: 10px;
            z-index: 9999;
        }

        .sugg {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .sugg img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1655942962729576" crossorigin="anonymous"></script>
    <ins class="adsbygoogle" style="display:block" data-ad-format="fluid" data-ad-layout-key="-ey+f-1k-38+bw" data-ad-client="ca-pub-1655942962729576" data-ad-slot="8926585630"></ins>
    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>


    <!-- HEADER -->
    <div class="header">
        <img src="https://pocketmusic.qzz.io/icon.png" style="width:50px;height:50px;border-radius:10px;">
        <h2 style="margin:0;">Pocket Music</h2>
        <a href="contact.html" target="_blank">Contact Us</a>
        <a href="aboutus.html" target="_blank">About Us</a>
        <input id="search" placeholder="Search..." oninput="liveSearch()">
        <div id="suggestions"></div>
    </div>


    <!-- HOME -->
    <div id="home"></div>

    <!-- FULL PLAYER -->
    <div class="full" id="fullPlayer">

        <img id="fimg">

        <h2 id="fname"></h2>

        <h3 id="fdescription"></h3>

        <audio id="audio" controls></audio>

        <div style="margin-top:20px">
            <button onclick="minimize()">⬇️</button>
            <button onclick="closeAll()">❌</button>
        </div>

    </div>

    <!-- MINI PLAYER -->
    <div class="mini" id="miniPlayer">
        <div style="display:flex;align-items:center;gap:10px;">
            <img id="mimg" style="width:55px;height:55px;border-radius:10px;object-fit:cover">

            <div style="flex:1">
                <div id="mname"></div>
            </div>

            <button onclick="togglePlay()">
                ▶️
            </button>
            <button onclick="closeAll()">❌</button>
        </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAnSBnETllDLMB47EKg8zSCKQcAycSZu7k",
            authDomain: "pocketamusic.firebaseapp.com",
            databaseURL: "https://pocketamusic-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pocketamusic",
            storageBucket: "pocketamusic.firebasestorage.app",
            messagingSenderId: "54287365789",
            appId: "1:54287365789:web:a4faba0305edfeb4f94674"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let songs = [];
        let categories = [];

        /* LOAD DATA (REALTIME) */
        function load() {

            db.ref("categories").on("value", snap => {
                categories = snap.val() || [];
                render();
            });

            db.ref("songs").on("value", snap => {
                let data = snap.val() || {};
                songs = Object.values(data);
                render();
            });

        }

        /* RENDER */
        function render(list = null, q = "") {
            let d = list || songs;
            home.innerHTML = "";

            categories.forEach(cat => {
                let s = d.filter(x => x.category == cat);
                if (!s.length) return;

                let rowId = "row_" + cat.replace(/\s+/g, "_");

                home.innerHTML += `

<div style="
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
">

<h3>${cat}</h3>

<div>
<button onclick="slideLeft('${rowId}')">⬅️</button>
<button onclick="slideRight('${rowId}')">➡️</button>
</div>

</div>

<div class="row" id="${rowId}">
${s.map(x=>`
<div class="card" onclick='playSong(${JSON.stringify(x)})'>
<img src="${x.image}">
<div style="padding:5px">${x.name}</div>
</div>
`).join("")}
</div>

`;
            });
        }

        /* PLAY */
        let currentSong = null;

function playSong(s) {

    currentSong = s;

    history.replaceState(
        {},
        "",
        "?song=" + encodeURIComponent(s.name)
    );

    fullPlayer.style.display = "flex";

    fimg.src = s.image;
    fname.innerText = s.name;
    fdescription.innerText = s.singer;
    audio.src = s.music;
    audio.play();

    miniPlayer.style.display = "none";
}

        /* MINIMIZE */
        function minimize() {
    fullPlayer.style.display = "none";
    miniPlayer.style.display = "block";

    mimg.src = fimg.src;
    mname.innerText = fname.innerText;

    // Current state check
    document.querySelector(".mini button").innerHTML =
        audio.paused ? "▶️" : "⏸";

    // Future updates
    audio.onplay = () => {
        document.querySelector(".mini button").innerHTML = "⏸";
    };

    audio.onpause = () => {
        document.querySelector(".mini button").innerHTML = "▶️";
    };
    }
    function togglePlay() {
    const btn = document.querySelector(".mini button");

    if (audio.paused) {
        audio.play();
        btn.innerHTML = "⏸";
    } else {
        audio.pause();
        btn.innerHTML = "▶️";
    }
}

        /* CLOSE */
        function closeAll() {
            audio.pause();
            audio.currentTime = 0;

            fullPlayer.style.display = "none";
            miniPlayer.style.display = "none";
        }

        /* PLAY PAUSE */
        function togglePlay() {
            if (audio.paused) audio.play();
            else audio.pause();
        }

        /* SEARCH */
        function liveSearch() {

            let q = search.value.trim().toLowerCase();

            suggestions.innerHTML = "";

            if (!q) {
                return;
            }

            let results = songs
                .filter(song =>
                    song.name.toLowerCase().includes(q)
                )
                .sort((a, b) => {

                    let aStarts = a.name.toLowerCase().startsWith(q);
                    let bStarts = b.name.toLowerCase().startsWith(q);

                    if (aStarts && !bStarts) return -1;
                    if (!aStarts && bStarts) return 1;

                    return a.name.localeCompare(b.name);

                });

            results.forEach(song => {

                let highlighted = song.name.replace(
                    new RegExp(q, "gi"),
                    match => `<span style="color:#1db954;font-weight:bold">${match}</span>`
                );

                suggestions.innerHTML += `
      <div class="sugg" onclick='playSong(${JSON.stringify(song)})'>
        <img src="${song.image}">
        <div>
          <div>${highlighted}</div>
          <small>${song.singer || ""}</small>
        </div>
      </div>
    `;
            });

        }
        /*scroll */
        function slideLeft(id) {
            document.getElementById(id).scrollBy({
                left: -300,
                behavior: "smooth"
            });
        }

        function slideRight(id) {
            document.getElementById(id).scrollBy({
                left: 300,
                behavior: "smooth"
            });
        }
        /* CLICK MINI OPEN FULL */
        miniPlayer.onclick = function(e) {
            if (e.target.tagName === "BUTTON") return;
            miniPlayer.style.display = "none";
            fullPlayer.style.display = "flex";
        }

        load();
    </script>

</body>

</html>
