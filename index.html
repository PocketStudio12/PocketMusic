<script>


// ======================================================
// FIREBASE
// ======================================================

const firebaseConfig = {

    apiKey:
        "AIzaSyAnSBnETllDLMB47EKg8zSCKQcAycSZu7k",

    authDomain:
        "pocketamusic.firebaseapp.com",

    databaseURL:
        "https://pocketamusic-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "pocketamusic",

    storageBucket:
        "pocketmusic.firebasestorage.app",

    messagingSenderId:
        "54287365789",

    appId:
        "1:54287365789:web:a4faba0305edfeb4f94674"

};


firebase.initializeApp(firebaseConfig);


const db =
    firebase.database();


// ======================================================
// GLOBAL DATA
// ======================================================

let categories = [];

let songs = [];

let currentSong = null;


// ======================================================
// PAGINATION
// ======================================================

const SONGS_PER_LOAD = 1;

const FIREBASE_BATCH_SIZE = 50;


const categoryState = {};


function getCategoryState(category){

    if(!categoryState[category]){

        categoryState[category] = {

            songs:[],

            lastKey:null,

            loading:false,

            finished:false,

            initialized:false

        };

    }


    return categoryState[category];

}


// ======================================================
// LOAD CATEGORIES
// ======================================================

function load(){

    db.ref("categories").on(

        "value",

        snap => {

            categories =
                snap.val() || [];


            render();


            setupCategoryObserver();

        }

    );

}


// ======================================================
// LOAD SONGS
// ======================================================

async function loadSongs(
    category,
    reset = false
){

    const state =
        getCategoryState(category);


    if(state.loading){

        return;

    }


    if(
        state.finished &&
        !reset
    ){

        return;

    }


    if(reset){

        state.songs = [];

        state.lastKey = null;

        state.finished = false;

        state.initialized = false;

    }


    state.loading = true;


    const requiredCount =
        state.songs.length +
        SONGS_PER_LOAD;


    try{

        while(

            state.songs.length <
            requiredCount &&

            !state.finished

        ){

            let query;


            if(
                state.lastKey === null
            ){

                query =
                    db.ref("songs")
                        .orderByKey()
                        .limitToFirst(
                            FIREBASE_BATCH_SIZE
                        );

            }

            else{

                query =
                    db.ref("songs")
                        .orderByKey()
                        .startAt(
                            state.lastKey
                        )
                        .limitToFirst(
                            FIREBASE_BATCH_SIZE + 1
                        );

            }


            const snap =
                await query.once("value");


            const data =
                snap.val() || {};


            let entries =
                Object.entries(data);


            if(!entries.length){

                state.finished = true;

                break;

            }


            if(
                state.lastKey !== null
            ){

                entries =
                    entries.filter(
                        ([key]) =>
                            key !==
                            state.lastKey
                    );

            }


            if(!entries.length){

                state.finished = true;

                break;

            }


            state.lastKey =
                entries[
                    entries.length - 1
                ][0];


            const matchingSongs =
                entries

                    .filter(
                        ([key,song]) =>
                            song.category ===
                            category
                    )

                    .map(
                        ([key,song]) => ({

                            ...song,

                            id:key

                        })
                    );


            state.songs.push(
                ...matchingSongs
            );


            if(
                entries.length <
                FIREBASE_BATCH_SIZE
            ){

                state.finished = true;

            }

        }


        state.initialized = true;


        updateGlobalSongs();


        render();

    }

    catch(error){

        console.error(
            "Failed to load " +
            category,
            error
        );

    }


    state.loading = false;

}


// ======================================================
// GLOBAL SONG LIST
// ======================================================

function updateGlobalSongs(){

    songs = [];


    categories.forEach(
        category => {

            const state =
                getCategoryState(
                    category
                );


            songs.push(
                ...state.songs
            );

        }
    );

}


// ======================================================
// RENDER
// ======================================================

function render(){

    home.innerHTML = "";


    categories.forEach(
        category => {

            const state =
                getCategoryState(
                    category
                );


            const rowId =
                "row_" +
                category.replace(
                    /\s+/g,
                    "_"
                );


            home.innerHTML += `

            <div
                class="category-section"
                data-category="${category}"
            >

                <div
                    class="category-header"
                >

                    <h3>
                        ${category}
                    </h3>


                    <div
                        class="category-buttons"
                    >

                        <button
                            onclick="
                            slideLeft(
                                '${rowId}'
                            )
                            "
                        >
                            ⬅️
                        </button>


                        <button
                            onclick="
                            slideRight(
                                '${rowId}'
                            )
                            "
                        >
                            ➡️
                        </button>

                    </div>

                </div>


                <div
                    class="row"
                    id="${rowId}"
                    data-category="${category}"
                >

                    ${
                        state.songs.length

                        ?

                        state.songs
                            .map(
                                song => `

                                <div
                                    class="card"
                                    onclick='playSong(${JSON.stringify(song)})'
                                >

                                    <img
                                        src="${song.image}"
                                        loading="lazy"
                                    >

                                    <div
                                        class="card-name"
                                    >
                                        ${song.name}
                                    </div>

                                </div>

                            `
                            )
                            .join("")

                        :

                        `
                        <div
                            class="loading"
                        >
                            Loading...
                        </div>
                        `
                    }

                </div>

            </div>

            `;

        }
    );

}


// ======================================================
// CATEGORY OBSERVER
// ======================================================

let categoryObserver;


function setupCategoryObserver(){

    if(categoryObserver){

        categoryObserver.disconnect();

    }


    categoryObserver =
        new IntersectionObserver(

            entries => {

                entries.forEach(
                    entry => {

                        if(
                            entry.isIntersecting
                        ){

                            const category =
                                entry.target
                                    .dataset
                                    .category;


                            const state =
                                getCategoryState(
                                    category
                                );


                            if(
                                !state.initialized
                            ){

                                loadSongs(
                                    category,
                                    true
                                );

                            }

                        }

                    }
                );

            },

            {
                rootMargin:
                    "500px 0px"
            }

        );


    document
        .querySelectorAll(
            ".category-section"
        )
        .forEach(
            section => {

                categoryObserver.observe(
                    section
                );

            }
        );

}


// ======================================================
// HORIZONTAL LOAD
// ======================================================

document.addEventListener(

    "scroll",

    event => {

        const row =
            event.target;


        if(
            !row.classList ||
            !row.classList.contains(
                "row"
            )
        ){

            return;

        }


        const position =
            row.scrollLeft +
            row.clientWidth;


        const width =
            row.scrollWidth;


        if(
            position >=
            width - 300
        ){

            const category =
                row.dataset.category;


            if(category){

                loadSongs(
                    category
                );

            }

        }

    },

    true

);


// ======================================================
// FORMAT TIME
// ======================================================

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


// ======================================================
// UPDATE PLAY BUTTON
// ======================================================

function updatePlayButtons(){

    const playing =
        !audio.paused &&
        !audio.ended;


    mainPlayButton.innerText =
        playing
            ? "⏸"
            : "▶";


    miniPlayButton.innerText =
        playing
            ? "⏸"
            : "▶";

}


// ======================================================
// PLAY SONG
// ======================================================

function playSong(song){

    currentSong =
        song;


    history.replaceState(

        {},

        "",

        "?song=" +
        encodeURIComponent(
            song.id
        )

    );


    fullPlayer.style.display =
        "flex";


    miniPlayer.style.display =
        "none";


    fimg.src =
        song.image;


    fname.innerText =
        song.name;


    fdescription.innerText =
        song.singer || "";


    mimg.src =
        song.image;


    mname.innerText =
        song.name;


    msinger.innerText =
        song.singer || "";


    audio.src =
        song.music;


    audio.load();


    resetProgress();


    audio.play()
        .catch(
            error => {

                console.log(
                    "Autoplay blocked:",
                    error
                );

            }
        );


    updatePlayButtons();

}


// ======================================================
// PLAY / PAUSE
// ======================================================

function togglePlay(event){

    if(event){

        event.stopPropagation();

    }


    if(!currentSong){

        return;

    }


    if(audio.paused){

        audio.play()
            .catch(
                error => {

                    console.log(error);

                }
            );

    }

    else{

        audio.pause();

    }

}


// ======================================================
// AUDIO PLAY
// ======================================================

audio.addEventListener(

    "play",

    function(){

        updatePlayButtons();

    }

);


// ======================================================
// AUDIO PAUSE
// ======================================================

audio.addEventListener(

    "pause",

    function(){

        updatePlayButtons();

    }

);


// ======================================================
// TIME UPDATE
// ======================================================

audio.addEventListener(

    "timeupdate",

    function(){

        const current =
            audio.currentTime || 0;


        const duration =
            audio.duration || 0;


        currentTime.innerText =
            formatTime(
                current
            );


        durationElement.innerText =
            formatTime(
                duration
            );


        if(
            duration &&
            Number.isFinite(duration)
        ){

            progressBar.value =
                (
                    current /
                    duration
                ) * 100;

        }

        else{

            progressBar.value = 0;

        }

    }

);


// ======================================================
// METADATA
// ======================================================

audio.addEventListener(

    "loadedmetadata",

    function(){

        durationElement.innerText =
            formatTime(
                audio.duration
            );

    }

);


// ======================================================
// PROGRESS BAR
// ======================================================

progressBar.addEventListener(

    "input",

    function(){

        if(
            !audio.duration ||
            !Number.isFinite(
                audio.duration
            )
        ){

            return;

        }


        audio.currentTime =
            (
                Number(
                    this.value
                ) / 100
            ) *
            audio.duration;

    }

);


// ======================================================
// RESET PROGRESS
// ======================================================

function resetProgress(){

    progressBar.value = 0;

    currentTime.innerText =
        "0:00";

    durationElement.innerText =
        "0:00";

}


// ======================================================
// SHARE
// ======================================================

function shareSong(){

    if(!currentSong){

        return;

    }


    const url =
        location.origin +
        location.pathname +
        "?song=" +
        encodeURIComponent(
            currentSong.id
        );


    if(
        typeof navigator.share ===
        "function"
    ){

        navigator.share({

            title:
                currentSong.name,

            text:
                currentSong.name +
                " - " +
                currentSong.singer,

            url:url

        })
        .catch(
            error => {

                console.log(
                    error
                );

            }
        );

    }

    else{

        navigator.clipboard
            .writeText(url)
            .then(
                () => {

                    alert(
                        "Song link copied!"
                    );

                }
            );

    }

}


// ======================================================
// MINIMIZE
// ======================================================

function minimize(){

    if(!currentSong){

        return;

    }


    fullPlayer.style.display =
        "none";


    miniPlayer.style.display =
        "block";


    mimg.src =
        currentSong.image;


    mname.innerText =
        currentSong.name;


    msinger.innerText =
        currentSong.singer || "";


    updatePlayButtons();

}


// ======================================================
// CLOSE
// ======================================================

function closeAll(event){

    if(event){

        event.stopPropagation();

    }


    audio.pause();


    audio.currentTime = 0;


    audio.removeAttribute(
        "src"
    );


    audio.load();


    fullPlayer.style.display =
        "none";


    miniPlayer.style.display =
        "none";


    currentSong = null;


    resetProgress();


    history.replaceState(

        {},

        "",

        location.pathname

    );

}


// ======================================================
// MINI PLAYER CLICK
// ======================================================

miniPlayer.addEventListener(

    "click",

    function(event){

        if(
            event.target.closest(
                "button"
            )
        ){

            return;

        }


        if(!currentSong){

            return;

        }


        miniPlayer.style.display =
            "none";


        fullPlayer.style.display =

    }

);


// ======================================================
// SEARCH
// ======================================================

function liveSearch(){

    const q =
        search.value
            .trim()
            .toLowerCase();


    suggestions.innerHTML =
        "";


    if(!q){

        return;

    }


    const results =
        songs

            .filter(
                song =>
                    (song.name || "")
                        .toLowerCase()
                        .includes(q)
            )

            .sort(
                (a,b) => {

                    const aStarts =
                        a.name
                            .toLowerCase()
                            .startsWith(q);


                    const bStarts =
                        b.name
                            .toLowerCase()
                            .startsWith(q);


                    if(
                        aStarts &&
                        !bStarts
                    ){

                        return -1;

                    }


                    if(
                        !aStarts &&
                        bStarts
                    ){

                        return 1;

                    }


                    return a.name
                        .localeCompare(
                            b.name
                        );

                }
            );


    results.forEach(
        song => {

            const escapedQ =
                q.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );


            const highlighted =
                song.name.replace(

                    new RegExp(
                        escapedQ,
                        "gi"
                    ),

                    match =>

                        `<span
                        style="
                        color:#1db954;
                        font-weight:bold;
                        "
                        >
                        ${match}
                        </span>`

                );


            suggestions.innerHTML += `

            <div
                class="sugg"
                onclick='playSong(${JSON.stringify(song)})'
            >

                <img
                    src="${song.image}"
                    loading="lazy"
                >


                <div>

                    <div>
                        ${highlighted}
                    </div>


                    <small>
                        ${song.singer || ""}
                    </small>

                </div>

            </div>

            `;

        }
    );

}


// ======================================================
// SLIDE LEFT
// ======================================================

function slideLeft(id){

    const row =
        document.getElementById(id);


    if(!row){

        return;

    }


    row.scrollBy({

        left:-300,

        behavior:"smooth"

    });

}


// ======================================================
// SLIDE RIGHT
// ======================================================

function slideRight(id){

    const row =
        document.getElementById(id);


    if(!row){

        return;

    }


    row.scrollBy({

        left:300,

        behavior:"smooth"

    });

}


// ======================================================
// OPEN SHARED SONG
// ======================================================

async function openSharedSong(){

    const songId =
        new URLSearchParams(
            location.search
        ).get("song");


    if(!songId){

        return;

    }


    let song =
        songs.find(
            x =>
                x.id === songId
        );


    if(song){

        playSong(song);

        return;

    }


    try{

        const snap =
            await db.ref(
                "songs/" +
                songId
            ).once("value");


        const data =
            snap.val();


        if(data){

            song = {

                ...data,

                id:songId

            };


            playSong(song);

        }

    }

    catch(error){

        console.error(
            "Shared song error:",
            error
        );

    }

}
