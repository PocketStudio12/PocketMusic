/* ======================================================
   ROOT
====================================================== */

html{
    margin:0;
    padding:0;
    min-height:100%;
    background:#000;
}


/* ======================================================
   BODY
====================================================== */

body{

    padding-bottom:

   HEADER
====================================================== */

.header{

    position:sticky;

    top:0;

    background:#000;

    padding:15px;

    z-index:100;

}


.header input{

    width:100%;

    padding:12px;

    border-radius:15px;

    background:#181818;

    color:white;

    box-sizing:border-box;

    margin-top:12px;

}


.header a{

    color:#aaa;

    text-decoration:none;

    font-size:13px;

}


/* ======================================================
   CATEGORY ROW
====================================================== */

.row{

    display:flex;

    overflow-x:auto;

    gap:12px;

    padding:10px;

}


.row::-webkit-scrollbar{

}

.category-buttons{

    gap:5px;

   SONG CARD
====================================================== */

.card{

    min-width:160px;

    max-width:160px;

    background:#181818;

    border-radius:15px;

    flex-shrink:0;

}


.card img{

    height:160px;

}

====================================================== */

<script>

/* ======================================================
   FIREBASE
====================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnSBnETllDLMB47EK8gSCKQcAycSZu7k",

    authDomain:
        "pocketamusic.firebaseapp.com",

    databaseURL:
        "https://pocketamusic-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "pocketamusic",

    storageBucket:
        "pocketmusic.firebasestorage.app",

    messagingSenderId:
        "54287365789",

    appId:
        "1:54287365789:web:a4faba0305edfeb4f94674"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* ======================================================
   ELEMENT REFERENCES
====================================================== */

const homeElement =
    document.getElementById("home");

const searchElement =
    document.getElementById("search");

const suggestionsElement =
    document.getElementById("suggestions");

const fullPlayerElement =
    document.getElementById("fullPlayer");

const miniPlayerElement =
    document.getElementById("miniPlayer");

const fimgElement =
    document.getElementById("fimg");

const fnameElement =
    document.getElementById("fname");

const fdescriptionElement =
    document.getElementById("fdescription");

const mimgElement =
    document.getElementById("mimg");

const mnameElement =
    document.getElementById("mname");

const msingerElement =
    document.getElementById("msinger");

const audioElement =
    document.getElementById("audio");

const progressBarElement =
    document.getElementById("progressBar");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");

const mainPlayButtonElement =
    document.getElementById("mainPlayButton");

const miniPlayButtonElement =
    document.getElementById("miniPlayButton");


/*
   IMPORTANT:
   Reference to bottom navigation.
*/
const bottomNavElement =
    document.querySelector(".bottom-nav");


/* ======================================================
   GLOBAL DATA
====================================================== */

let categories = [];

let songs = [];

let currentSong = null;


/* ======================================================
   PAGINATION
====================================================== */

const SONGS_PER_LOAD = 1;

const FIREBASE_BATCH_SIZE = 50;

const categoryState = {};


function getCategoryState(category){

    if(!categoryState[category]){

        categoryState[category] = {

            songs:[],

            lastKey:null,

            loading:false,

            finished:false,

            initialized:false

        };

    }

    return categoryState[category];

}


/* ======================================================
   LOAD CATEGORIES
====================================================== */

function load(){

    db.ref("categories").on(

        "value",

        snap => {

            categories =
                snap.val() || [];

            render();

            setupCategoryObserver();

        }

    );

}


/* ======================================================
   LOAD SONGS
====================================================== */

async function loadSongs(
    category,
    reset = false
){

    const state =
        getCategoryState(category);


    if(state.loading){

        return;

    }


    if(
        state.finished &&
        !reset
    ){

        return;

    }


    if(reset){

        state.songs = [];

        state.lastKey = null;

        state.finished = false;

        state.initialized = false;

    }


    state.loading = true;


    const requiredCount =
        state.songs.length +
        SONGS_PER_LOAD;


    try{

        while(

            state.songs.length <
            requiredCount &&

            !state.finished

        ){

            let query;


            if(
                state.lastKey === null
            ){

                query =
                    db.ref("songs")
                        .orderByKey()
                        .limitToFirst(
                            FIREBASE_BATCH_SIZE
                        );

            }

            else{

                query =
                    db.ref("songs")
                        .orderByKey()
                        .startAt(
                            state.lastKey
                        )
                        .limitToFirst(
                            FIREBASE_BATCH_SIZE + 1
                        );

            }


            const snap =
                await query.once("value");


            const data =
                snap.val() || {};


            let entries =
                Object.entries(data);


            if(!entries.length){

                state.finished = true;

                break;

            }


            if(
                state.lastKey !== null
            ){

                entries =
                    entries.filter(
                        ([key]) =>
                            key !==
                            state.lastKey
                    );

            }


            if(!entries.length){

                state.finished = true;

                break;

            }


            state.lastKey =
                entries[
                    entries.length - 1
                ][0];


            const matchingSongs =
                entries

                    .filter(
                        ([key,song]) =>
                            song.category ===
                            category
                    )

                    .map(
                        ([key,song]) => ({

                            ...song,

                            id:key

                        })
                    );


            state.songs.push(
                ...matchingSongs
            );


            if(
                entries.length <
                FIREBASE_BATCH_SIZE
            ){

                state.finished = true;

            }

        }


        state.initialized = true;

        updateGlobalSongs();

        render();

    }

    catch(error){

        console.error(
            "Failed to load " +
            category,
            error
        );

    }


    state.loading = false;

}


/* ======================================================
   GLOBAL SONG LIST
====================================================== */

function updateGlobalSongs(){

    songs = [];

    categories.forEach(
        category => {

            const state =
                getCategoryState(
                    category
                );

            songs.push(
                ...state.songs
            );

        }
    );

}


/* ======================================================
   RENDER
====================================================== */

function render(){

    homeElement.innerHTML = "";


    categories.forEach(
        category => {

            const state =
                getCategoryState(category);


            const rowId =
                "row_" +
                category.replace(
                    /\s+/g,
                    "_"
                );


            homeElement.innerHTML += `

            <div
                class="category-section"
                data-category="${category}"
            >

                <div
                    class="category-header"
                >

                    <h3>
                        ${category}
                    </h3>


                    <div
                        class="category-buttons"
                    >

                        <button
                            onclick="
                                slideLeft(
                                    '${rowId}'
                                )
                            "
                        >
                            ⬅️
                        </button>


                        <button
                            onclick="
                                slideRight(
                                    '${rowId}'
                                )
                            "
                        >
                            ➡️
                        </button>

                    </div>

                </div>


                <div
                    class="row"
                    id="${rowId}"
                    data-category="${category}"
                >

                    ${
                        state.songs.length

                        ?

                        state.songs
                            .map(
                                song => `

                                <div
                                    class="card"
                                    onclick='playSong(${JSON.stringify(song)})'
                                >

                                    <img
                                        src="${song.image}"
                                        loading="lazy"
                                    >

                                    <div
                                        class="card-name"
                                    >
                                        ${song.name}
                                    </div>

                                </div>

                            `
                            )
                            .join("")

                        :

                        `
                        <div class="loading">
                            Loading...
                        </div>
                        `
                    }

                </div>

            </div>

            `;

        }
    );

}


/* ======================================================
   CATEGORY OBSERVER
====================================================== */

let categoryObserver;


function setupCategoryObserver(){

    if(categoryObserver){

        categoryObserver.disconnect();

    }


    categoryObserver =
        new IntersectionObserver(

            entries => {

                entries.forEach(
                    entry => {

                        if(
                            entry.isIntersecting
                        ){

                            const category =
                                entry.target
                                    .dataset
                                    .category;


                            const state =
                                getCategoryState(
                                    category
                                );


                            if(
                                !state.initialized
                            ){

                                loadSongs(
                                    category,
                                    true
                                );

                            }

                        }

                    }
                );

            },

            {
                rootMargin:
                    "500px 0px"
            }

        );


    document
        .querySelectorAll(
            ".category-section"
        )
        .forEach(
            section => {

                categoryObserver.observe(
                    section
                );

            }
        );

}


/* ======================================================
   HORIZONTAL LOAD
====================================================== */

document.addEventListener(

    "scroll",

    event => {

        const row =
            event.target;


        if(
            !row.classList ||
            !row.classList.contains("row")
        ){

            return;

        }


        const position =
            row.scrollLeft +
            row.clientWidth;


        const width =
            row.scrollWidth;


        if(
            position >=
            width - 300
        ){

            const category =
                row.dataset.category;


            if(category){

                loadSongs(category);

            }

        }

    },

    true

);


/* ======================================================
   FORMAT TIME
====================================================== */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


/* ======================================================
   UPDATE PLAY BUTTONS
====================================================== */

function updatePlayButtons(){

    const playing =
        !audioElement.paused &&
        !audioElement.ended;


    mainPlayButtonElement.innerText =
        playing
            ? "⏸"
            : "▶";


    miniPlayButtonElement.innerText =
        playing
            ? "⏸"
            : "▶";

}


/* ======================================================
   PLAY SONG
====================================================== */

function playSong(song){

    currentSong = song;


    history.replaceState(
        {},
        "",
        "?song=" +
        encodeURIComponent(song.id)
    );


    /*
       OPEN FULL PLAYER
    */

    fullPlayerElement.style.display =
        "flex";

    miniPlayerElement.style.display =
        "none";


    /*
       IMPORTANT:
       Hide Home / Playlist / Profile
       while full player is open.
    */

    bottomNavElement.style.display =
        "none";


    fimgElement.src =
        song.image || "";

    fnameElement.innerText =
        song.name || "";

    fdescriptionElement.innerText =
        song.singer || "";


    mimgElement.src =
        song.image || "";

    mnameElement.innerText =
        song.name || "";

    msingerElement.innerText =
        song.singer || "";


    audioElement.src =
        song.music || "";

    audioElement.load();


    resetProgress();


    audioElement.play()
        .catch(
            error => {

                console.log(
                    "Autoplay blocked:",
                    error
                );

            }
        );


    updatePlayButtons();

}


/* ======================================================
   PLAY / PAUSE
====================================================== */

function togglePlay(event){

    if(event){

        event.stopPropagation();

    }


    if(!currentSong){

        return;

    }


    if(audioElement.paused){

        audioElement.play()
            .catch(
                error => {

                    console.log(error);

                }
            );

    }

    else{

        audioElement.pause();

    }

}


/* ======================================================
   AUDIO EVENTS
====================================================== */

audioElement.addEventListener(
    "play",
    updatePlayButtons
);


audioElement.addEventListener(
    "pause",
    updatePlayButtons
);


audioElement.addEventListener(

    "timeupdate",

    function(){

        const current =
            audioElement.currentTime || 0;


        const duration =
            audioElement.duration || 0;


        currentTimeElement.innerText =
            formatTime(current);


        durationElement.innerText =
            formatTime(duration);


        if(
            duration &&
            Number.isFinite(duration)
        ){

            progressBarElement.value =
                (
                    current /
                    duration
                ) * 100;

        }

        else{

            progressBarElement.value = 0;

        }

    }

);


audioElement.addEventListener(

    "loadedmetadata",

    function(){

        durationElement.innerText =
            formatTime(
                audioElement.duration
            );

    }

);


/* ======================================================
   PROGRESS BAR
====================================================== */

progressBarElement.addEventListener(

    "input",

    function(){

        if(
            !audioElement.duration ||
            !Number.isFinite(
                audioElement.duration
            )
        ){

            return;

        }


        audioElement.currentTime =
            (
                Number(this.value) /
                100
            ) *
            audioElement.duration;

    }

);


/* ======================================================
   RESET PROGRESS
====================================================== */

function resetProgress(){

    progressBarElement.value = 0;

    currentTimeElement.innerText =
        "0:00";

    durationElement.innerText =
        "0:00";

}


/* ======================================================
   SHARE
====================================================== */

function shareSong(){

    if(!currentSong){

        return;

    }


    const url =
        location.origin +
        location.pathname +
        "?song=" +
        encodeURIComponent(
            currentSong.id
        );


    if(
        typeof navigator.share ===
        "function"
    ){

        navigator.share({

            title:
                currentSong.name,

            text:
                currentSong.name +
                " - " +
                currentSong.singer,

            url:url

        })
        .catch(
            error => {

                console.log(error);

            }
        );

    }

    else if(
        navigator.clipboard
    ){

        navigator.clipboard
            .writeText(url)
            .then(
                () => {

                    alert(
                        "Song link copied!"
                    );

                }
            );

    }

    else{

        alert(url);

    }

}


/* ======================================================
   MINIMIZE
====================================================== */

function minimize(){

    if(!currentSong){

        return;

    }


    /*
       Hide full player
    */

    fullPlayerElement.style.display =
        "none";


    /*
       Show mini player
    */

    miniPlayerElement.style.display =
        "block";


    /*
       IMPORTANT:
       Show Home / Playlist / Profile again.
    */

    bottomNavElement.style.display =
        "flex";


    mimgElement.src =
        currentSong.image || "";

    mnameElement.innerText =
        currentSong.name || "";

    msingerElement.innerText =
        currentSong.singer || "";


    updatePlayButtons();

}


/* ======================================================
   CLOSE
====================================================== */

function closeAll(event){

    if(event){

        event.stopPropagation();

    }


    audioElement.pause();

    audioElement.currentTime = 0;

    audioElement.removeAttribute("src");

    audioElement.load();


    fullPlayerElement.style.display =
        "none";

    miniPlayerElement.style.display =
        "none";


    /*
       IMPORTANT:
       Show bottom navigation after closing.
    */

    bottomNavElement.style.display =
        "flex";


    currentSong = null;


    resetProgress();


    history.replaceState(
        {},
        "",
        location.pathname
    );

}


/* ======================================================
   MINI PLAYER CLICK
====================================================== */

miniPlayerElement.addEventListener(

    "click",

    function(event){

        if(
            event.target.closest("button")
        ){

            return;

        }


        if(!currentSong){

            return;

        }


        miniPlayerElement.style.display =
            "none";


        fullPlayerElement.style.display =
            "flex";


        /*
           Hide bottom navigation again
           when returning to full player.
        */

        bottomNavElement.style.display =
            "none";

    }

);


/* ======================================================
   SEARCH
====================================================== */

function liveSearch(){

    const q =
        searchElement.value
            .trim()
            .toLowerCase();


    suggestionsElement.innerHTML = "";


    if(!q){

        return;

    }


    const results =
        songs

            .filter(
                song =>
                    (song.name || "")
                        .toLowerCase()
                        .includes(q)
            )

            .sort(
                (a,b) => {

                    const aStarts =
                        (a.name || "")
                            .toLowerCase()
                            .startsWith(q);


                    const bStarts =
                        (b.name || "")
                            .toLowerCase()
                            .startsWith(q);


                    if(
                        aStarts &&
                        !bStarts
                    ){

                        return -1;

                    }


                    if(
                        !aStarts &&
                        bStarts
                    ){

                        return 1;

                    }


                    return (
                        a.name || ""
                    ).localeCompare(
                        b.name || ""
                    );

                }
            );


    results.forEach(
        song => {

            const escapedQ =
                q.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );


            const highlighted =
                (song.name || "").replace(

                    new RegExp(
                        escapedQ,
                        "gi"
                    ),

                    match =>

                        `<span
                            style="
                                color:#1db954;
                                font-weight:bold;
                            "
                        >
                            ${match}
                        </span>`

                );


            suggestionsElement.innerHTML += `

            <div
                class="sugg"
                onclick='playSong(${JSON.stringify(song)})'
            >

                <img
                    src="${song.image || ""}"
                    loading="lazy"
                >

                <div>

                    <div>
                        ${highlighted}
                    </div>

                    <small>
                        ${song.singer || ""}
                    </small>

                </div>

            </div>

            `;

        }
    );

}


/* ======================================================
   SLIDE LEFT
====================================================== */

function slideLeft(id){

    const row =
        document.getElementById(id);


    if(!row){

        return;

    }


    row.scrollBy({

        left:-300,

        behavior:"smooth"

    });

}


/* ======================================================
   SLIDE RIGHT
====================================================== */

function slideRight(id){

    const row =
        document.getElementById(id);


    if(!row){

        return;

    }


    row.scrollBy({

        left:300,

        behavior:"smooth"

    });

}


/* ======================================================
   OPEN SHARED SONG
====================================================== */

async function openSharedSong(){

    const songId =
        new URLSearchParams(
            location.search
        ).get("song");


    if(!songId){

        return;

    }


    let song =
        songs.find(
            x =>
                x.id === songId
        );


    if(song){

        playSong(song);

        return;

    }


    try{

        const snap =
            await db.ref(
                "songs/" +
                songId
            ).once("value");


        const data =
            snap.val();


        if(data){

            song = {

                ...data,

                id:songId

            };


            playSong(song);

        }

    }

    catch(error){

        console.error(
            "Shared song error:",
            error
        );

    }

}
