<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocket Music</title>

<meta property="og:title" content="Pocket Music">
<meta property="og:description" content="Listen Music Online">
<meta property="og:image" content="icon.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1655942962729576"
     crossorigin="anonymous"></script>
<link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
<link rel="shortcut icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#000;
  color:white;
}

/* HEADER */
.header{padding:10px;}
.header input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#1c1c1c;
  color:white;
}

#suggestions{
  background:#111;
  border-radius:10px;
  margin-top:5px;
}
.sugg{
  display:flex;
  padding:8px;
  cursor:pointer;
}
.sugg img{
  width:40px;
  height:40px;
  border-radius:6px;
  margin-right:10px;
}

/* SONG LIST */
.row{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding:10px;
}
.card{
  min-width:140px;
  background:#181818;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}
.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

/* FULL PLAYER */
.full{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.full img{
  width:250px;
  border-radius:20px;
}

/* MINI PLAYER */
.mini{
  position:fixed;
  bottom:60px;
  left:10px;
  right:10px;
  background:#181818;
  padding:10px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1655942962729576"
     crossorigin="anonymous"></script>
<ins class="adsbygoogle"
     style="display:block"
     data-ad-format="fluid"
     data-ad-layout-key="-ey+f-1k-38+bw"
     data-ad-client="ca-pub-1655942962729576"
     data-ad-slot="8926585630"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
     
<!-- HEADER -->
<div class="header">
  <img src="/icon.png" style="width:50px;height:50px;border-radius:10px;">
    <h2 style="margin:0;">Pocket Music</h2>
    <a href="contact.html">Contact</a>
  <input id="search" placeholder="Search..." oninput="liveSearch()">
  <div id="suggestions"></div>
</div>

<!-- HOME -->
<div id="home"></div>

<!-- FULL PLAYER -->
<div class="full" id="fullPlayer">
  <img id="fimg">
  <h2 id="fname"></h2>
  <h3 id="fdescription"></h3>
  <audio id="audio" controls></audio>

  <button onclick="minimize()">Minimize</button>
  <button onclick="closeAll()">Close</button>
</div>

<!-- MINI PLAYER -->
<div class="mini" id="miniPlayer">
  <img id="mimg" style="width:50px;height:50px;border-radius:8px;">
  <span id="mname"></span>
  <button onclick="togglePlay()">▶/⏸</button>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
 apiKey: "AIzaSyAnSBnETllDLMB47EKg8zSCKQcAycSZu7k",
  authDomain: "pocketamusic.firebaseapp.com",
  databaseURL: "https://pocketamusic-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pocketamusic",
  storageBucket: "pocketamusic.firebasestorage.app",
  messagingSenderId: "54287365789",
  appId: "1:54287365789:web:a4faba0305edfeb4f94674"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let songs = [];
let categories = [];

/* LOAD DATA (REALTIME) */
function load(){

  db.ref("categories").on("value", snap=>{
    categories = snap.val() || [];
    render();
  });

  db.ref("songs").on("value", snap=>{
    let data = snap.val() || {};
    songs = Object.values(data);
    render();
  });

}

/* RENDER */
function render(list=null,q=""){
  let d = list || songs;
  home.innerHTML = "";

  categories.forEach(cat=>{
    let s = d.filter(x=>x.category==cat);
    if(!s.length) return;

    let rowId = "row_" + cat.replace(/\s+/g,"_");

    home.innerHTML += `

<div style="
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
">

<h3>${cat}</h3>

<div>
<button onclick="slideLeft('${rowId}')">⬅️</button>
<button onclick="slideRight('${rowId}')">➡️</button>
</div>

</div>

<div class="row" id="${rowId}">
${s.map(x=>`
<div class="card" onclick='playSong(${JSON.stringify(x)})'>
<img src="${x.image}">
<div style="padding:5px">${x.name}</div>
</div>
`).join("")}
</div>

`;
    
}

/* PLAY */
function playSong(s){
  fullPlayer.style.display="flex";

  fimg.src=s.image;
  fname.innerText=s.name;
  fdescription.innerText=s.singer;
  audio.src=s.music;
  audio.play();

  miniPlayer.style.display="none";
}

/* MINIMIZE */
function minimize(){
  fullPlayer.style.display="none";
  miniPlayer.style.display="block";

  mimg.src=fimg.src;
  mname.innerText=fname.innerText;
}

/* CLOSE */
function closeAll(){
  audio.pause();
  audio.currentTime=0;

  fullPlayer.style.display="none";
  miniPlayer.style.display="none";
}

/* PLAY PAUSE */
function togglePlay(){
  if(audio.paused) audio.play();
  else audio.pause();
}

/* SEARCH */
function liveSearch(){
  let q = search.value.toLowerCase();

  let f = songs.filter(s=>s.name.toLowerCase().includes(q));

  render(f);
}
/*scroll */
function slideLeft(id){
  document.getElementById(id).scrollBy({
    left:-300,
    behavior:"smooth"
  });
}

function slideRight(id){
  document.getElementById(id).scrollBy({
    left:300,
    behavior:"smooth"
  });
}
/* CLICK MINI OPEN FULL */
miniPlayer.onclick = function(e){
  if(e.target.tagName === "BUTTON") return;
  miniPlayer.style.display="none";
  fullPlayer.style.display="flex";
}

load();
</script>

</body>
     </html>
