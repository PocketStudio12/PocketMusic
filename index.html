<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnSBnETllDLMB47EK8gSCKQcAycSZu7k",

    authDomain:
        "pocketamusic.firebaseapp.com",

    databaseURL:
        "https://pocketamusic-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "pocketamusic",

    storageBucket:
        "pocketmusic.firebasestorage.app",

    messagingSenderId:
        "54287365789",

    appId:
        "1:54287365789:web:a4faba0305edfeb4f94674"

};


firebase.initializeApp(firebaseConfig);

const db =
    firebase.database();


/* =========================================================
   ELEMENTS
========================================================= */

const home =
    document.getElementById("home");

const searchInput =
    document.getElementById("searchInput");

const searchClear =
    document.getElementById("searchClear");

const searchResults =
    document.getElementById("searchResults");

const searchList =
    document.getElementById("searchList");

const searchResultTitle =
    document.getElementById("searchResultTitle");

const fullPlayer =
    document.getElementById("fullPlayer");

const miniPlayer =
    document.getElementById("miniPlayer");

const bottomNav =
    document.getElementById("bottomNav");

const audio =
    document.getElementById("audio");

const fimg =
    document.getElementById("fimg");

const fname =
    document.getElementById("fname");

const fdescription =
    document.getElementById("fdescription");

const mimg =
    document.getElementById("mimg");

const mname =
    document.getElementById("mname");

const msinger =
    document.getElementById("msinger");

const playButton =
    document.getElementById("playButton");

const miniPlayButton =
    document.getElementById("miniPlayButton");

const progress =
    document.getElementById("progress");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");


/* =========================================================
   DATA
========================================================= */

let categories = [];

let allSongs = [];

let currentSong = null;

let playerRequest = 0;

let categoryState = {};

let categoryRows = {};

let observer = null;

const SONGS_PER_LOAD = 1;

const DEFAULT_IMAGE =
    "https://pocketmusic.qzz.io/icon.png";


/* =========================================================
   NORMALIZE SEARCH
========================================================= */

function normalizeSearch(value){

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g," ");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   IMAGE
========================================================= */

function setPlayerImage(element,url){

    const imageUrl =
        url || DEFAULT_IMAGE;

    element.onerror = function(){

        this.onerror = null;
        this.src = DEFAULT_IMAGE;

    };

    element.src = imageUrl;

}


/* =========================================================
   LAZY IMAGE OBSERVER
========================================================= */

const imageObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if(!entry.isIntersecting){
                    return;
                }

                const img =
                    entry.target;

                const url =
                    img.dataset.src;

                if(url){

                    img.onerror = function(){

                        this.onerror = null;
                        this.src = DEFAULT_IMAGE;

                    };

                    img.src = url;

                    delete img.dataset.src;

                }

                imageObserver.unobserve(img);

            });

        },
        {
            root:null,
            rootMargin:"180px",
            threshold:0.01
        }
    );


function observeImages(){

    document
        .querySelectorAll(
            "img[data-src]"
        )
        .forEach(img => {

            imageObserver.observe(img);

        });

}


/* =========================================================
   LOAD CATEGORIES
========================================================= */

function loadCategories(){

    db.ref("categories")
        .on(
            "value",
            snapshot => {

                categories = [];

                snapshot.forEach(child => {

                    const value =
                        child.val();

                    if(typeof value === "string"){

                        categories.push(value);

                    }
                    else if(
                        value &&
                        value.name
                    ){

                        categories.push(
                            value.name
                        );

                    }

                });


                if(categories.length === 0){

                    categories = [
                        "Hindi",
                        "Bengali"
                    ];

                }


                renderHome();

                setupCategoryObserver();

            },
            error => {

                console.error(
                    "Categories error:",
                    error
                );

            }
        );

}


/* =========================================================
   LOAD ALL SONGS FOR SEARCH
========================================================= */

function loadAllSongsForSearch(){

    return db.ref("songs")
        .once("value")
        .then(snapshot => {

            const result = [];

            snapshot.forEach(child => {

                const song =
                    child.val() || {};

                song.id =
                    child.key;

                result.push(song);

            });

            allSongs = result;

            return result;

        })
        .catch(error => {

            console.error(
                "Search song loading error:",
                error
            );

            return [];

        });

}


/* =========================================================
   LOAD CATEGORY SONGS
========================================================= */

function loadCategorySongs(
    category,
    reset = false
){

    if(!categoryState[category]){

        categoryState[category] = {

            songs:[],
            loadedKeys:{},
            lastKey:null,
            loading:false,
            finished:false

        };

    }


    const state =
        categoryState[category];


    if(state.loading){
        return;
    }


    if(state.finished && !reset){
        return;
    }


    if(reset){

        state.songs = [];
        state.loadedKeys = {};
        state.lastKey = null;
        state.finished = false;

    }


    state.loading = true;


    let query =
        db.ref("songs")
            .orderByKey()
            .limitToFirst(50);


    if(state.lastKey){

        query =
            db.ref("songs")
                .orderByKey()
                .startAt(state.lastKey)
                .limitToFirst(51);

    }


    query.once("value")
        .then(snapshot => {

            const batch = [];

            snapshot.forEach(child => {

                if(
                    state.lastKey &&
                    child.key === state.lastKey
                ){
                    return;
                }

                const song =
                    child.val() || {};

                song.id =
                    child.key;

                if(
                    String(song.category || "")
                        .toLowerCase()
                    ===
                    String(category || "")
                        .toLowerCase()
                ){

                    batch.push(song);

                }

            });


            const children =
                [];

            snapshot.forEach(child => {

                children.push(child);

            });


            if(children.length > 0){

                state.lastKey =
                    children[children.length - 1].key;

            }


            children.forEach(child => {

                const song =
                    child.val() || {};

                song.id =
                    child.key;

                if(
                    String(song.category || "")
                        .toLowerCase()
                    ===
                    String(category || "")
                        .toLowerCase()
                ){

                    if(
                        !state.loadedKeys[song.id]
                    ){

                        state.loadedKeys[song.id] = true;

                        state.songs.push(song);

                    }

                }

            });


            if(
                children.length < 50
            ){

                state.finished = true;

            }


            state.loading = false;


            renderCategory(
                category
            );


            observeImages();

        })
        .catch(error => {

            console.error(
                "Category load error:",
                category,
                error
            );

            state.loading = false;

        });

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(){

    home.innerHTML = "";

    categoryRows = {};

    categories.forEach(category => {

        const section =
            document.createElement("section");

        section.className =
            "category";

        section.dataset.category =
            category;


        section.innerHTML = `

            <div class="category-head">

                <div class="category-title">
                    ${escapeHTML(category)}
                </div>

                <div class="category-controls">

                    <button
                        class="row-btn"
                        type="button"
                        onclick="scrollCategory('${escapeHTML(category).replace(/'/g,"\\'")}','left')"
                    >
                        ‹
                    </button>

                    <button
                        class="row-btn"
                        type="button"
                        onclick="scrollCategory('${escapeHTML(category).replace(/'/g,"\\'")}','right')"
                    >
                        ›
                    </button>

                </div>

            </div>


            <div
                class="song-row"
                data-row="${escapeHTML(category)}"
            ></div>

        `;


        home.appendChild(section);


        const row =
            section.querySelector(".song-row");


        categoryRows[category] =
            row;


        row.addEventListener(
            "scroll",
            () => {

                if(
                    row.scrollLeft +
                    row.clientWidth >=
                    row.scrollWidth - 400
                ){

                    loadCategorySongs(
                        category
                    );

                }

            },
            {
                passive:true
            }
        );


        loadCategorySongs(
            category,
            true
        );

    });


    observeImages();

}


/* =========================================================
   RENDER CATEGORY
========================================================= */

function renderCategory(category){

    const row =
        categoryRows[category];

    if(!row){
        return;
    }


    const state =
        categoryState[category];

    if(!state){
        return;
    }


    row.innerHTML = "";


    if(
        state.songs.length === 0
    ){

        row.innerHTML = `

            <div class="empty-category">
                No songs available
            </div>

        `;

        return;

    }


    state.songs.forEach(song => {

        const card =
            document.createElement("div");

        card.className =
            "card";


        const image =
            song.image || DEFAULT_IMAGE;


        card.innerHTML = `

            <div class="card-image-wrap">

                <img
                    data-src="${escapeHTML(image)}"
                    src="${DEFAULT_IMAGE}"
                    alt=""
                    loading="lazy"
                >

            </div>


            <div class="card-name">
                ${escapeHTML(song.name || "Unknown Song")}
            </div>


            <div class="card-singer">
                ${escapeHTML(song.singer || "Unknown Singer")}
            </div>

        `;


        card.addEventListener(
            "click",
            function(){

                playSong(song);

            }
        );


        row.appendChild(card);

    });


    observeImages();

}


/* =========================================================
   CATEGORY OBSERVER
========================================================= */

function setupCategoryObserver(){

    if(observer){

        observer.disconnect();

    }


    observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if(
                        entry.isIntersecting
                    ){

                        const category =
                            entry.target
                                .dataset
                                .category;

                        if(category){

                            loadCategorySongs(
                                category
                            );

                        }

                        observer.unobserve(
                            entry.target
                        );

                    }

                });

            },
            {
                root:null,
                rootMargin:"500px",
                threshold:0.01
            }
        );


    document
        .querySelectorAll(".category")
        .forEach(section => {

            observer.observe(section);

        });

}


/* =========================================================
   HORIZONTAL SCROLL
========================================================= */

function scrollCategory(
    category,
    direction
){

    const row =
        categoryRows[category];

    if(!row){
        return;
    }


    const amount =
        row.clientWidth * 0.75;


    row.scrollBy({

        left:
            direction === "right"
                ? amount
                : -amount,

        behavior:"smooth"

    });

}


/* =========================================================
   SEARCH
========================================================= */

let searchTimer = null;


searchInput.addEventListener(
    "input",
    function(){

        const value =
            this.value;


        searchClear.style.display =
            value.trim()
                ? "block"
                : "none";


        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                () => {

                    performSearch(
                        value
                    );

                },
                120
            );

    }
);


searchClear.addEventListener(
    "click",
    function(){

        searchInput.value = "";

        searchResults.style.display =
            "none";

        searchList.innerHTML =
            "";

        searchClear.style.display =
            "none";

        searchInput.focus();

    }
);


function performSearch(value){

    const query =
        normalizeSearch(value);


    if(!query){

        searchResults.style.display =
            "none";

        searchList.innerHTML =
            "";

        return;

    }


    searchResults.style.display =
        "block";


    searchResultTitle.textContent =
        "Searching...";


    /*
       IMPORTANT:
       Search loads the complete songs
       database separately.
    */

    loadAllSongsForSearch()
        .then(songs => {

            const results =
                songs.filter(song => {

                    const name =
                        normalizeSearch(
                            song.name
                        );

                    const singer =
                        normalizeSearch(
                            song.singer
                        );

                    const category =
                        normalizeSearch(
                            song.category
                        );


                    return (
                        name.includes(query) ||
                        singer.includes(query) ||
                        category.includes(query)
                    );

                });


            renderSearchResults(
                results
            );

        });

}


function renderSearchResults(
    results
){

    searchList.innerHTML =
        "";


    searchResultTitle.textContent =
        results.length +
        (
            results.length === 1
                ? " result"
                : " results"
        );


    if(results.length === 0){

        searchList.innerHTML = `

            <div class="empty-category">
                No songs found
            </div>

        `;

        return;

    }


    results.forEach(song => {

        const item =
            document.createElement("div");

        item.className =
            "search-song";


        const image =
            song.image || DEFAULT_IMAGE;


        item.innerHTML = `

            <img
                src="${escapeHTML(image)}"
                alt=""
                onerror="this.onerror=null;this.src='${DEFAULT_IMAGE}'"
            >

            <div class="search-song-info">

                <div class="search-song-name">
                    ${escapeHTML(song.name || "Unknown Song")}
                </div>

                <div class="search-song-singer">
                    ${escapeHTML(song.singer || "Unknown Singer")}
                </div>

            </div>

        `;


        item.addEventListener(
            "click",
            function(){

                playSong(song);

            }
        );


        searchList.appendChild(item);

    });

}


/* =========================================================
   PLAY SONG
========================================================= */

function playSong(song){

    if(!song){
        return;
    }


    const request =
        ++playerRequest;


    currentSong =
        song;


    /*
       OPEN PLAYER FIRST.
       No await here.
       Therefore tapping a card immediately
       opens the player.
    */

    fullPlayer.style.display =
        "flex";

    miniPlayer.style.display =
        "none";

    bottomNav.style.display =
        "none";


    /*
       IMAGE IS NOT LAZY IN PLAYER.
       It loads immediately.
    */

    setPlayerImage(
        fimg,
        song.image || DEFAULT_IMAGE
    );

    setPlayerImage(
        mimg,
        song.image || DEFAULT_IMAGE
    );


    fname.textContent =
        song.name ||
        "Unknown Song";


    fdescription.textContent =
        song.singer ||
        "Unknown Singer";


    mname.textContent =
        song.name ||
        "Unknown Song";


    msinger.textContent =
        song.singer ||
        "Unknown Singer";


    updatePlayButtons();


    /*
       SHARE URL
    */

    const url =
        new URL(
            window.location.href
        );


    url.search = "";

    url.searchParams.set(
        "song",
        song.id
    );


    history.replaceState(
        {},
        "",
        url.pathname +
        "?" +
        url.searchParams.toString() +
        url.hash
    );


    /*
       STOP OLD AUDIO
    */

    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    /*
       IMPORTANT:
       Audio loads ONLY after
       user selects a song.
    */

    if(song.music){

        audio.src =
            song.music;

        audio.preload =
            "auto";

        audio.load();


        /*
           Direct tap = user gesture.
           Try autoplay immediately.
        */

        const promise =
            audio.play();


        if(promise){

            promise.catch(
                error => {

                    console.log(
                        "Autoplay prevented:",
                        error
                    );

                    updatePlayButtons();

                }
            );

        }

    }


    /*
       Prevent old request from changing UI.
    */

    if(request !== playerRequest){
        return;
    }


    updatePlayButtons();

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

    if(!currentSong){
        return;
    }


    if(!audio.src){

        if(currentSong.music){

            audio.src =
                currentSong.music;

            audio.preload =
                "auto";

            audio.load();

        }
        else{

            return;

        }

    }


    if(audio.paused){

        audio.play()
            .catch(error => {

                console.error(
                    "Play error:",
                    error
                );

            });

    }
    else{

        audio.pause();

    }


    updatePlayButtons();

}


/* =========================================================
   UPDATE PLAY BUTTONS
========================================================= */

function updatePlayButtons(){

    const playing =
        currentSong &&
        !audio.paused &&
        !audio.ended;


    playButton.textContent =
        playing
            ? "❚❚"
            : "▶";


    miniPlayButton.textContent =
        playing
            ? "❚❚"
            : "▶";

}


/* =========================================================
   AUDIO EVENTS
========================================================= */

audio.addEventListener(
    "play",
    updatePlayButtons
);

audio.addEventListener(
    "pause",
    updatePlayButtons
);

audio.addEventListener(
    "ended",
    updatePlayButtons
);


audio.addEventListener(
    "loadedmetadata",
    function(){

        durationElement.textContent =
            formatTime(
                audio.duration
            );

    }
);


audio.addEventListener(
    "timeupdate",
    function(){

        if(!audio.duration){
            return;
        }


        progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        currentTimeElement.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================================
   PROGRESS
========================================================= */

progress.addEventListener(
    "input",
    function(){

        if(!audio.duration){
            return;
        }


        audio.currentTime =
            (
                Number(this.value) /
                100
            ) *
            audio.duration;

    }
);


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


/* =========================================================
   MINIMIZE
========================================================= */

function minimizePlayer(){

    if(!currentSong){
        return;
    }


    fullPlayer.style.display =
        "none";

    miniPlayer.style.display =
        "flex";

    bottomNav.style.display =
        "flex";

}


/* =========================================================
   RESTORE
========================================================= */

function restorePlayer(){

    if(!currentSong){
        return;
    }


    fullPlayer.style.display =
        "flex";

    miniPlayer.style.display =
        "none";

    bottomNav.style.display =
        "none";

}


/* =========================================================
   CLOSE
========================================================= */

function closePlayer(){

    playerRequest++;


    audio.pause();

    audio.removeAttribute(
        "src"
    );

    audio.load();


    currentSong =
        null;


    fullPlayer.style.display =
        "none";

    miniPlayer.style.display =
        "none";

    bottomNav.style.display =
        "flex";


    progress.value =
        0;


    currentTimeElement.textContent =
        "0:00";

    durationElement.textContent =
        "0:00";


    /*
       Remove ?song=...
    */

    const url =
        new URL(
            window.location.href
        );

    url.search = "";

    history.replaceState(
        {},
        "",
        url.pathname +
        url.hash
    );


    updatePlayButtons();

}


/* =========================================================
   SHARE
========================================================= */

async function shareSong(){

    if(!currentSong){
        return;
    }


    const url =
        new URL(
            window.location.href
        );


    url.search = "";

    url.searchParams.set(
        "song",
        currentSong.id
    );


    const shareUrl =
        url.toString();


    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    currentSong.name ||
                    "Pocket Music",

                text:
                    (
                        currentSong.name ||
                        "Listen on Pocket Music"
                    ),

                url:
                    shareUrl

            });

        }
        catch(error){

            console.log(
                "Share cancelled"
            );

        }

    }
    else{

        try{

            await navigator.clipboard.writeText(
                shareUrl
            );

            alert(
                "Song link copied!"
            );

        }
        catch(error){

            prompt(
                "Copy this link:",
                shareUrl
            );

        }

    }

}


/* =========================================================
   OPEN SHARED SONG
========================================================= */

async function openSharedSong(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const songId =
        params.get("song");


    if(!songId){
        return;
    }


    /*
       First check already-loaded songs.
    */

    let song =
        allSongs.find(
            item =>
                item.id === songId
        );


    /*
       If not found, directly load
       the Firebase song by key.
    */

    if(!song){

        try{

            const snapshot =
                await db
                    .ref(
                        "songs/" +
                        songId
                    )
                    .once(
                        "value"
                    );


            if(
                snapshot.exists()
            ){

                song =
                    snapshot.val() || {};

                song.id =
                    snapshot.key;

            }

        }
        catch(error){

            console.error(
                "Shared song error:",
                error
            );

        }

    }


    if(song){

        playSong(song);

    }
    else{

        console.log(
            "Song not found:",
            songId
        );

    }

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadCategories();


/*
   Search database in background.
   This does NOT load audio.
*/

loadAllSongsForSearch();


/*
   Shared song.
*/

setTimeout(
    openSharedSong,
    500
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            updatePlayButtons();

        }

    }
);

</script>
