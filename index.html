<!DOCTYPE html>
<html>

<head>
<script>
const ANALYTICS_SERVER = "https://api.pocketstudio.qzz.io";

const visitorId =
    localStorage.getItem("pocket_visitor_id") ||
    crypto.randomUUID();

localStorage.setItem("pocket_visitor_id", visitorId);

const ua = navigator.userAgent;

let browser = "Unknown";
let browserVersion = "Unknown";

if (ua.includes("Edg/")) {
    browser = "Edge";
    browserVersion = ua.split("Edg/")[1].split(" ")[0];
} else if (ua.includes("Chrome/")) {
    browser = "Chrome";
    browserVersion = ua.split("Chrome/")[1].split(" ")[0];
} else if (ua.includes("Firefox/")) {
    browser = "Firefox";
    browserVersion = ua.split("Firefox/")[1].split(" ")[0];
} else if (ua.includes("Safari/")) {
    browser = "Safari";
}

let os = "Unknown";

if (ua.includes("Android")) {
    os = "Android";
} else if (ua.includes("Windows")) {
    os = "Windows";
} else if (ua.includes("Mac OS")) {
    os = "macOS";
} else if (ua.includes("Linux")) {
    os = "Linux";
} else if (ua.includes("iPhone") || ua.includes("iPad")) {
    os = "iOS";
}

let device = "Desktop";

if (/Android|iPhone|iPad|Mobile/i.test(ua)) {
    device = "Mobile";
}

fetch(ANALYTICS_SERVER + "/track", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        id: visitorId,
        page: location.pathname,
        referrer: document.referrer || "direct",

        browser: browser,
        browserVersion: browserVersion,

        os: os,
        device: device,

        screenWidth: screen.width,
        screenHeight: screen.height,

        language: navigator.language,

        timezone:
            Intl.DateTimeFormat().resolvedOptions().timeZone,

        userAgent: navigator.userAgent
    })
})
.then(async response => {

    const text = await response.text();

    console.log("Analytics status:", response.status);
    console.log("Analytics response:", text);

})
.catch(error => {

    console.error("Analytics ERROR:", error);

});
</script>

    <style>

<body>


    <!-- HEADER -->

    <div class="header">

                height:50px;

            "

        <h2 style="margin:0;">

        <div

    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>


    <script>

        // ======================================================
        // FIREBASE
        // ======================================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyAnSBnETllDLMB47EKg8zSCKQcAycSZu7k",

            authDomain:
                "pocketamusic.firebaseapp.com",

            databaseURL:
                "https://pocketamusic-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "pocketamusic",

            storageBucket:
                "pocketamusic.firebasestorage.app",

            messagingSenderId:
                "54287365789",

            appId:
                "1:54287365789:web:a4faba0305edfeb4f94674"

        };


        firebase.initializeApp(firebaseConfig);

        const db =
            firebase.database();


        // ======================================================
        // GLOBAL DATA
        // ======================================================

        let categories = [];

        let songs = [];

        let currentSong = null;


        // ======================================================
        // PAGINATION SETTINGS
        // ======================================================

        const SONGS_PER_LOAD = 1;

        const FIREBASE_BATCH_SIZE = 50;


        // Each category has its own state
        const categoryState = {};


        function getCategoryState(category) {

            if (!categoryState[category]) {

                categoryState[category] = {

                    songs: [],

                    lastKey: null,

                    loading: false,

                    finished: false,

                    initialized: false

                };

            }

            return categoryState[category];

        }


        // ======================================================
        // LOAD CATEGORIES
        // ======================================================

        function load() {

            db.ref("categories").on(
                "value",
                snap => {

                    categories =
                        snap.val() || [];

                    render();

                    setupCategoryObserver();

                }
            );

        }


        // ======================================================
        // LOAD SONGS FOR ONE CATEGORY
        // ======================================================

        async function loadSongs(
            category,
            reset = false
        ) {

            const state =
                getCategoryState(category);


            if (state.loading) {
                return;
            }


            if (
                state.finished &&
                !reset
            ) {
                return;
            }


            if (reset) {

                state.songs = [];

                state.lastKey = null;

                state.finished = false;

                state.initialized = false;

            }


            state.loading = true;


            const requiredCount =
                state.songs.length +
                SONGS_PER_LOAD;


            try {

                while (
                    state.songs.length <
                    requiredCount &&
                    !state.finished
                ) {


                    let query;


                    // First batch

                    if (
                        state.lastKey === null
                    ) {

                        query =
                            db.ref("songs")
                                .orderByKey()
                                .limitToFirst(
                                    FIREBASE_BATCH_SIZE
                                );

                    }


                    // Next batch

                    else {

                        query =
                            db.ref("songs")
                                .orderByKey()
                                .startAt(
                                    state.lastKey
                                )
                                .limitToFirst(
                                    FIREBASE_BATCH_SIZE + 1
                                );

                    }


                    const snap =
                        await query.once("value");


                    const data =
                        snap.val() || {};


                    let entries =
                        Object.entries(data);


                    if (!entries.length) {

                        state.finished = true;

                        break;

                    }


                    // Remove duplicate last key

                    if (
                        state.lastKey !== null
                    ) {

                        entries =
                            entries.filter(
                                ([key]) =>
                                    key !==
                                    state.lastKey
                            );

                    }


                    if (!entries.length) {

                        state.finished = true;

                        break;

                    }


                    // Update pagination position

                    state.lastKey =
                        entries[
                            entries.length - 1
                        ][0];


                    // Find only this category

                    const matchingSongs =
                        entries
                            .filter(
                                ([key, song]) =>
                                    song.category ===
                                    category
                            )
                            .map(
                                ([key, song]) => ({

                                    ...song,

                                    id: key

                                })
                            );


                    // Add songs

                    state.songs.push(
                        ...matchingSongs
                    );


                    // Firebase reached end

                    if (
                        entries.length <
                        FIREBASE_BATCH_SIZE
                    ) {

                        state.finished = true;

                    }

                }


                state.initialized = true;


                // Update global songs list

                updateGlobalSongs();


                render();


            }
            catch (error) {

                console.error(
                    "Failed to load " +
                    category,
                    error
                );

            }


            state.loading = false;

        }


        // ======================================================
        // UPDATE GLOBAL SONG LIST
        // ======================================================

        function updateGlobalSongs() {

            songs = [];


            categories.forEach(
                category => {

                    const state =
                        getCategoryState(
                            category
                        );


                    songs.push(
                        ...state.songs
                    );

                }
            );

        }


        // ======================================================
        // RENDER
        // ======================================================

        function render() {

            home.innerHTML = "";


            categories.forEach(
                category => {

                    const state =
                        getCategoryState(
                            category
                        );


                    const rowId =
                        "row_" +
                        category
                            .replace(
                                /\s+/g,
                                "_"
                            );


                    home.innerHTML += `

                    <div
                        class="category-section"
                        data-category="${category}"
                    >

                        <div
                            class="category-header"
                        >

                            <h3>
                                ${category}
                            </h3>


                            <div
                                class="category-buttons"
                            >

                                <button
                                    onclick="
                                    slideLeft(
                                        '${rowId}'
                                    )
                                    "
                                >
                                    ⬅️
                                </button>


                                <button
                                    onclick="
                                    slideRight(
                                        '${rowId}'
                                    )
                                    "
                                >
                                    ➡️
                                </button>

                            </div>

                        </div>


                        <div
                            class="row"
                            id="${rowId}"
                            data-category="${category}"
                        >

                            ${
                                state.songs.length

                                ?

                                state.songs
                                    .map(
                                        song => `

                                        <div
                                            class="card"
                                            onclick='playSong(${JSON.stringify(song)})'
                                        >

                                            <img
                                                src="${song.image}"
                                                loading="lazy"
                                            >

                                            <div
                                                class="card-name"
                                            >
                                                ${song.name}
                                            </div>

                                        </div>

                                    `
                                    )
                                    .join("")

                                :

                                `
                                <div
                                    class="loading"
                                >
                                    Loading...
                                </div>
                                `
                            }

                        </div>

                    </div>

                    `;

                }
            );

        }


        // ======================================================
        // CATEGORY SCREEN OBSERVER
        // ======================================================

        let categoryObserver;


        function setupCategoryObserver() {

            if (categoryObserver) {

                categoryObserver.disconnect();

            }


            categoryObserver =
                new IntersectionObserver(
                    entries => {

                        entries.forEach(
                            entry => {

                                if (
                                    entry.isIntersecting
                                ) {

                                    const category =
                                        entry.target
                                            .dataset
                                            .category;


                                    const state =
                                        getCategoryState(
                                            category
                                        );


                                    // Load only when
                                    // category is near screen

                                    if (
                                        !state.initialized
                                    ) {

                                        loadSongs(
                                            category,
                                            true
                                        );

                                    }

                                }

                            }
                        );

                    },

                    {
                        rootMargin:
                            "500px 0px"
                    }

                );


            document
                .querySelectorAll(
                    ".category-section"
                )
                .forEach(
                    section => {

                        categoryObserver.observe(
                            section
                        );

                    }
                );

        }


        // ======================================================
        // HORIZONTAL SCROLL
        // ======================================================

        document.addEventListener(
            "scroll",
            event => {

                const row =
                    event.target;


                if (
                    !row.classList ||
                    !row.classList.contains(
                        "row"
                    )
                ) {

                    return;

                }


                const position =
                    row.scrollLeft +
                    row.clientWidth;


                const width =
                    row.scrollWidth;


                // Near right side

                if (
                    position >=
                    width - 300
                ) {

                    const category =
                        row.dataset.category;


                    if (category) {

                        loadSongs(
                            category
                        );

                    }

                }

            },
            true
        );


        // ======================================================
        // PLAY SONG
        // ======================================================

        function playSong(song) {

            currentSong =
                song;


            history.replaceState(
                {},
                "",
                "?song=" +
                encodeURIComponent(
                    song.id
                )
            );


            fullPlayer.style.display =
                "flex";


            fimg.src =
                song.image;


            fname.innerText =
                song.name;


            fdescription.innerText =
                song.singer || "";


            // Audio loads only now

            audio.src =
                song.music;


            audio.play();


            miniPlayer.style.display =
                "none";

        }


        // ======================================================
        // SHARE
        // ======================================================

        function shareSong() {

            if (!currentSong) {
                return;
            }


            const url =
                location.origin +
                location.pathname +
                "?song=" +
                encodeURIComponent(
                    currentSong.id
                );


            if (
                typeof navigator.share ===
                "function"
            ) {

                navigator.share({

                    title:
                        currentSong.name,

                    text:
                        currentSong.name +
                        " - " +
                        currentSong.singer,

                    url:
                        url

                });

            }
            else {

                navigator.clipboard
                    .writeText(url);

                alert(
                    "Song link copied!"
                );

            }

        }


        // ======================================================
        // MINIMIZE
        // ======================================================

        function minimize() {

            fullPlayer.style.display =
                "none";


            miniPlayer.style.display =
                "block";


            mimg.src =
                fimg.src;


            mname.innerText =
                fname.innerText;


            updateMiniButton();

        }


        function updateMiniButton() {

            miniPlayButton.innerText =
                audio.paused
                    ? "▶️"
                    : "⏸";

        }


        function togglePlay() {

            if (audio.paused) {

                audio.play();

            }
            else {

                audio.pause();

            }


            updateMiniButton();

        }


        audio.addEventListener(
            "play",
            updateMiniButton
        );


        audio.addEventListener(
            "pause",
            updateMiniButton
        );


        // ======================================================
        // CLOSE
        // ======================================================

        function closeAll() {

            audio.pause();

            audio.currentTime = 0;

            audio.removeAttribute(
                "src"
            );

            audio.load();


            fullPlayer.style.display =
                "none";


            miniPlayer.style.display =
                "none";


            currentSong = null;


            history.replaceState(
                {},
                "",
                location.pathname
            );

        }


        // ======================================================
        // SEARCH
        // ======================================================

        function liveSearch() {

            const q =
                search.value
                    .trim()
                    .toLowerCase();


            suggestions.innerHTML =
                "";


            if (!q) {

                return;

            }


            const results =
                songs

                    .filter(
                        song =>
                            (song.name || "")
                                .toLowerCase()
                                .includes(q)
                    )

                    .sort(
                        (a, b) => {

                            const aStarts =
                                a.name
                                    .toLowerCase()
                                    .startsWith(q);


                            const bStarts =
                                b.name
                                    .toLowerCase()
                                    .startsWith(q);


                            if (
                                aStarts &&
                                !bStarts
                            ) {

                                return -1;

                            }


                            if (
                                !aStarts &&
                                bStarts
                            ) {

                                return 1;

                            }


                            return a.name
                                .localeCompare(
                                    b.name
                                );

                        }
                    );


            results.forEach(
                song => {

                    const escapedQ =
                        q.replace(
                            /[.*+?^${}()|[\]\\]/g,
                            "\\$&"
                        );


                    const highlighted =
                        song.name.replace(
                            new RegExp(
                                escapedQ,
                                "gi"
                            ),
                            match =>
                                `<span
                                style="
                                color:#1db954;
                                font-weight:bold;
                                "
                                >
                                ${match}
                                </span>`
                        );


                    suggestions.innerHTML += `

                    <div
                        class="sugg"
                        onclick='playSong(${JSON.stringify(song)})'
                    >

                        <img
                            src="${song.image}"
                            loading="lazy"
                        >

                        <div>

                            <div>
                                ${highlighted}
                            </div>

                            <small>
                                ${song.singer || ""}
                            </small>

                        </div>

                    </div>

                    `;

                }
            );

        }


        // ======================================================
        // SLIDE LEFT
        // ======================================================

        function slideLeft(id) {

            const row =
                document.getElementById(id);


            if (!row) {
                return;
            }


            row.scrollBy({

                left: -300,

                behavior: "smooth"

            });

        }


        // ======================================================
        // SLIDE RIGHT
        // ======================================================

        function slideRight(id) {

            const row =
                document.getElementById(id);


            if (!row) {
                return;
            }


            row.scrollBy({

                left: 300,

                behavior: "smooth"

            });

        }


        // ======================================================
        // CLICK MINI PLAYER
        // ======================================================

        miniPlayer.onclick =
            function(event) {

                if (
                    event.target.tagName ===
                    "BUTTON"
                ) {

                    return;

                }


                miniPlayer.style.display =
                    "none";


                fullPlayer.style.display =
                    "flex";

            };


        // ======================================================
        // OPEN SHARED SONG
        // ======================================================

        async function openSharedSong() {

            const songId =
                new URLSearchParams(
                    location.search
                ).get("song");


            if (!songId) {
                return;
            }


            // First check songs already loaded

            let song =
                songs.find(
                    x =>
                        x.id === songId
                );


            if (song) {

                playSong(song);

                return;

            }


            // If not loaded, directly get
            // that song from Firebase

            try {

                const snap =
                    await db.ref(
                        "songs/" +
                        songId
                    ).once("value");


                const data =
                    snap.val();


                if (data) {

                    song = {

                        ...data,

                        id: songId

                    };


                    playSong(song);

                }

            }
            catch (error) {

                console.error(
                    "Shared song error:",
                    error
                );

            }

        }


        // ======================================================
        // START
        // ======================================================

        load();


        // Shared link check after Firebase
        // page has started

        openSharedSong();

    </script>

</body>
